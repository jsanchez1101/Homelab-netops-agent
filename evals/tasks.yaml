# Training/development suite for the live VyOS OSPF triangle.
# A pass requires both a grounded answer and task-appropriate successful evidence.
split: train
tasks:
  - id: t01
    difficulty: easy
    task: "How many OSPF neighbors does R1 have?"
    check: lead_regex
    expect: '(?i)^\s*(?:r1\s+has\s+)?2\s+(?:ospf\s+)?neighbors?\b'
    evidence:
      any:
        - device: R1
          command: '^show ip ospf neighbor$'
          validator: ospf_neighbor_id_set
          expect: ["10.50.0.2", "3.3.3.3"]
    topology: {type: node, primary: R1, desc: "R1 adjacency count"}

  - id: t02
    difficulty: easy
    task: "What VyOS version is R2 running? Give the version string."
    check: lead_regex
    expect: '(?i)^.*\b2026\.06\.10-0053-rolling\b'
    evidence:
      any:
        - {device: R2, command: '^show version$', output: '2026\.06\.10-0053-rolling'}
    topology: {type: node, primary: R2, desc: "R2 system info"}

  - id: t03
    difficulty: easy
    task: "Is interface eth1 on R1 up or down?"
    check: lead_regex
    expect: '(?i)^\s*(?:(?:interface\s+)?eth1\s+on\s+r1|r1(?:''s)?\s+(?:interface\s+)?eth1|(?:interface\s+)?eth1)\s+is\s+up\b'
    evidence:
      any:
        - {device: R1, command: '^show interfaces ethernet eth1$', output: '(?im)^eth1(?::|\s+is).*\b(?:state\s+)?UP\b'}
    topology: {type: interface, primary: R1, interface: eth1, desc: "R1 eth1 state"}

  - id: t04
    difficulty: easy
    task: "What is R3's OSPF router ID?"
    check: lead_regex
    expect: '(?i)^.*\b3\.3\.3\.3\b'
    evidence:
      any:
        - {device: R3, command: '^show ip ospf(?: database| interface(?: \S+)?)?$', output: '(?:Router ID\s*:?\s*3\.3\.3\.3|OSPF Router with ID \(3\.3\.3\.3\))'}
    topology: {type: node, primary: R3, desc: "R3 OSPF identity"}

  - id: t05
    difficulty: medium
    task: "What routing protocol is running on R1, and what router ID is it using?"
    check: lead_contains_all
    expect: ["ospf", "1.1.1.1"]
    evidence:
      any:
        - {device: R1, command: '^show ip ospf(?: database| interface(?: \S+)?)?$', output: '(?:Router ID\s*:?\s*1\.1\.1\.1|OSPF Router with ID \(1\.1\.1\.1\))'}
    topology: {type: node, primary: R1, desc: "R1 OSPF state"}

  - id: t06
    difficulty: medium
    task: "Which router is the OSPF DR on the link between R1 and R2? Name the device."
    check: device_role_answer
    expect: R2
    evidence:
      any:
        - {device: R1, command: '^show ip ospf interface eth1$', output: 'Designated Router \(ID\) 10\.50\.0\.2'}
        - {device: R2, command: '^show ip ospf interface eth1$', output: 'State DR\b'}
    topology: {type: link, primary: link-r1-r2, desc: "R1-R2 DR election"}

  - id: t07
    difficulty: medium
    task: "How many routes did R2 learn from OSPF neighbors? Count only routes with a next-hop via another router, not directly connected ones. Give just the count."
    check: integer_answer
    expect: 3
    evidence:
      any:
        - device: R2
          command: '^show ip route ospf$'
          validator: ospf_via_route_prefix_set
          expect: ["1.1.1.1/32", "3.3.3.3/32", "10.0.13.0/30"]
    topology: {type: node, primary: R2, desc: "R2 RIB OSPF count"}

  - id: t08
    difficulty: medium
    task: "What is the IP address of R3's interface that connects to R2?"
    check: lead_regex
    expect: '^.*\b10\.0\.23\.2\b'
    evidence:
      any:
        - {device: R3, command: '^show interfaces(?: ethernet eth1)?$', output: '\b10\.0\.23\.2/30\b'}
    topology: {type: link, primary: link-r2-r3, desc: "R3→R2 addressing"}

  - id: t09
    difficulty: hard
    task: "Can R1 reach R2's loopback 10.50.0.2 according to its routing table? Answer yes or no, and name the next-hop IP."
    check: affirmative_contains_all
    expect: ["10.0.12.2"]
    evidence:
      any:
        - {device: R1, command: '^show ip route(?: ospf| 10\.50\.0\.2)?$', output: '(?s)10\.50\.0\.2/32.*(?:via\s+10\.0\.12\.2|10\.0\.12\.2,\s+via)'}
    topology: {type: path, primary: path-r1-r2, desc: "R1→R2 loopback reachability"}

  - id: t10
    difficulty: hard
    task: "Do the OSPF hello and dead timers on the R1-R2 link match between the two routers? Answer 'match' or 'mismatch' and give the values."
    check: lead_regex
    expect: '(?i)^\s*match\b.*\b10\b.*\b40\b'
    evidence:
      all:
        - {device: R1, command: '^show ip ospf interface eth1$', output: 'Hello 10s, Dead 40s'}
        - {device: R2, command: '^show ip ospf interface eth1$', output: 'Hello 10s, Dead 40s'}
    topology: {type: link, primary: link-r1-r2, desc: "R1-R2 timer consistency"}

  - id: t11
    difficulty: hard
    task: "If the link between R1 and R2 went down, would R1 still have a path to 10.50.0.2? Answer yes or no and explain via which router."
    check: lead_regex
    expect: '(?i)^\s*yes\b.*\br3\b'
    evidence:
      all:
        - device: R1
          command: '^show ip route 3\.3\.3\.3(?:/32)?$'
          validator: route_via
          prefix: 3.3.3.3/32
          via: 10.0.13.2
        - device: R3
          command: '^show ip route 10\.50\.0\.2(?:/32)?$'
          validator: route_via
          prefix: 10.50.0.2/32
          via: 10.0.23.1
    topology: {type: path, primary: path-r1-r3-r2, desc: "R1→R2 failover via R3"}

  - id: t12
    difficulty: hard
    task: "List the router IDs of all OSPF routers in area 0. Give all three."
    check: ip_set
    expect: ["1.1.1.1", "10.50.0.2", "3.3.3.3"]
    evidence:
      alternatives:
        - any:
            - {device: R1, command: '^show ip ospf database$', validator: ospf_database_router_id_set, expect: ["1.1.1.1", "10.50.0.2", "3.3.3.3"]}
            - {device: R2, command: '^show ip ospf database$', validator: ospf_database_router_id_set, expect: ["1.1.1.1", "10.50.0.2", "3.3.3.3"]}
            - {device: R3, command: '^show ip ospf database$', validator: ospf_database_router_id_set, expect: ["1.1.1.1", "10.50.0.2", "3.3.3.3"]}
        - all:
            - {device: R1, command: '^show ip ospf interface(?: \S+)?$', validator: local_ospf_router_id, expect: "1.1.1.1"}
            - {device: R2, command: '^show ip ospf interface(?: \S+)?$', validator: local_ospf_router_id, expect: "10.50.0.2"}
            - {device: R3, command: '^show ip ospf interface(?: \S+)?$', validator: local_ospf_router_id, expect: "3.3.3.3"}
    topology: {type: area, primary: area-0, desc: "Area 0 completeness"}
